name: Hello GitHub Actions

on:
  push:
    branches: [ main ]

jobs:
  custom-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "👋 Hello again from GitHub Actions!"

      - name: Show Date and Time
        run: date

      - name: Show Branch Name
        run: 'echo "Branch: ${{ github.ref_name }}"'

      - name: List all files
        run: ls -la