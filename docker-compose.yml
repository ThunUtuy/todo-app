version: "3.9"

services:
  backend:
    build: ./backend
    container_name: flask-backend
    #env_file:
      #- backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app  # optional for live reload
    environment:
      FLASK_APP: app
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DB_USERNAME: postgres
      DB_PASSWORD: 2004THun 
      SECRET_KEY: "a;lsdkoisdhgo"

  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
